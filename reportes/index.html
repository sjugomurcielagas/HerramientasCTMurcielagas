<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reportes de entrenamiento</title><link rel="stylesheet" href="murcielapp.css?v=20261103c"></head><body><div class="app">
    <nav class="top-nav" aria-label="Navegación principal">
      <a class="back-home" href="../" aria-label="Volver al inicio">← Inicio</a>
      <div class="module-title" aria-label="Módulo actual"><strong>Reportes</strong></div>
      <div class="report-brand" aria-label="Identidad institucional">
        <img class="logo-fadec" src="../assets/fadec-logo.webp" alt="FADEC">
        <img class="logo-murcielagas" src="../assets/logo-murcielagas.webp" alt="Las Murciélagas">
      </div>
    </nav>

<header class="report-header"><h1>Reportes de entrenamiento</h1><p>El entrenamiento del equipo, en un solo lugar.</p></header>
<main id="daily-report" class="panel daily-report" aria-labelledby="daily-title">
  <div class="panel-body">

    <h2 id="daily-title" tabindex="-1">Entrenamientos del equipo</h2>
    <p>Elegí una jugadora o todo el equipo y el período que querés consultar.</p>
    <form id="daily-auth" class="daily-controls">
      <label for="daily-key">Clave del cuerpo técnico<input id="daily-key" type="password" autocomplete="current-password" required></label>
      <label><span>Recordar acceso en este navegador</span><input id="daily-remember" type="checkbox"></label>
      <button class="primary" type="submit">Entrar a Reportes</button>
    </form>
    <div class="daily-controls" id="daily-session" hidden><span>Acceso del cuerpo técnico</span><button id="daily-logout" type="button">Cerrar sesión</button></div>
    <p id="daily-status" role="status" aria-live="polite">Ingresá para consultar los registros del equipo.</p>
    <div id="daily-workspace" hidden>
      <form id="daily-range" class="daily-controls">
        <label for="daily-player">Jugadora<select id="daily-player"><option value="">Todo el equipo</option></select></label>
        <label for="daily-period">Período<select id="daily-period"><option value="week">Esta semana</option><option value="month">Este mes</option><option value="year">Este año</option><option value="custom">Elegir fechas</option></select></label>
        <div id="daily-dates" class="daily-controls" hidden>
          <label for="daily-from">Desde<input id="daily-from" type="date" required></label>
          <label for="daily-to">Hasta<input id="daily-to" type="date" required></label>
        </div>
        <label for="daily-type">Tipo de estímulo<select id="daily-type"><option value="">Todos los tipos</option><option value="fisico">Físico</option><option value="tecnico">Técnico-táctico</option><option value="otros">Otros</option></select></label>
        <button class="primary" id="daily-refresh" type="submit">Ver reporte</button>
      </form>
      <div class="daily-controls">
        <label for="daily-view">Ver por<select id="daily-view"><option value="day">Día</option><option value="week">Semana</option><option value="month">Mes</option></select></label>
        <button id="daily-export" type="button" disabled>Descargar datos</button>
      </div>
      <div id="daily-output" hidden></div>
    </div>

  </div>
</main></div>
<script src="../assets/config.js?v=20261020"></script><script src="murcielapp-model.js?v=20261103c"></script><script src="historico.js?v=20261103c"></script><script src="murcielapp.js?v=20261103c"></script></body></html>
