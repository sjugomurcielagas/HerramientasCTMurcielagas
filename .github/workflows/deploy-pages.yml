name: Deploy sitio

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias
        run: npm ci --ignore-scripts
      - name: Instalar navegador de pruebas
        run: npx playwright install --with-deps chromium
      - name: Verificar backend, reportes y experiencia de jugadoras
        run: npm test
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - name: Verificar creación de estímulos
        run: npm run test:smoke
        env:
          PLAYWRIGHT_CHANNEL: chromium
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy a Pages
        id: deployment
        uses: actions/deploy-pages@v4
