<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Entrenar · MurcielApp</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 18px;
      line-height: 1.5;
      background: var(--page-bg);
      color: var(--text);
      --azul: #0b2f5f;
      --celeste: #d9f1fc;
      --borde: #afc5d7;
      --page-bg: #f4f9fd;
      --surface: white;
      --text: #102033;
      --heading: #0b2f5f;
      --soft-bg: #edf6fb;
      --pair-bg: #f4f9fd;
      --kicker: #305475;
      --action-bg: #0b2f5f;
      --action-text: white;
      --action-outline: #0b2f5f;
      --action-quiet-bg: white;
      --action-quiet-text: #0b2f5f;
      --nav-border: #afc5d7;
      --step-border: #0b2f5f;
      --focus: #ab5500;
    }
    :root[data-contrast="dark"] {
      color-scheme: dark;
      --page-bg: #000;
      --surface: #000;
      --text: #fff;
      --heading: #fff;
      --borde: #fff;
      --soft-bg: #171717;
      --pair-bg: #101010;
      --kicker: #fff;
      --action-bg: #fff;
      --action-text: #000;
      --action-outline: #fff;
      --action-quiet-bg: #000;
      --action-quiet-text: #fff;
      --nav-border: #fff;
      --step-border: #fff;
      --focus: #fff;
    }
    :root[data-contrast="light"] {
      --page-bg: #fff;
      --surface: #fff;
      --text: #000;
      --heading: #000;
      --borde: #000;
      --soft-bg: #f4f4f4;
      --pair-bg: #fff;
      --kicker: #000;
      --action-bg: #000;
      --action-text: #fff;
      --action-outline: #000;
      --action-quiet-bg: #fff;
      --action-quiet-text: #000;
      --nav-border: #000;
      --step-border: #000;
      --focus: #000;
    }
    :root[data-highlight="yes"] {
      --action-bg: #a94200;
      --action-text: #fff;
      --action-outline: #a94200;
      --action-quiet-text: #a94200;
      --nav-border: #a94200;
      --focus: #000;
    }
    :root[data-contrast="dark"][data-highlight="yes"] {
      --action-bg: #ffad33;
      --action-text: #000;
      --action-outline: #ffad33;
      --action-quiet-text: #ffad33;
      --nav-border: #ffad33;
      --focus: #fff;
    }
    :root[data-text-size="large"] { font-size: 22.5px; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    [hidden] { display: none !important; }
    button, a { font: inherit; }
    button { min-height: 48px; }
    button { cursor: pointer; }
    button:disabled { cursor: default; opacity: .55; }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    .skip { position: absolute; left: 12px; top: -100px; background: var(--surface); color: var(--text); padding: 10px; z-index: 10; }
    .skip:focus { top: 12px; }
    header { background: var(--surface); border-bottom: 1px solid var(--borde); }
    .wrap { width: min(100% - 32px, 760px); margin-inline: auto; }
    .header-inner { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding-block: 12px; }
    .brand { margin: 0; color: var(--heading); font-size: 1.5rem; line-height: 1.2; }
    .subtitle { margin: 0; font-size: .85rem; }
    nav { background: var(--surface); border-bottom: 1px solid var(--borde); }
    .nav-inner { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding-block: 12px; }
    .nav-btn { color: var(--action-quiet-text); background: var(--action-quiet-bg); border: 2px solid var(--nav-border); border-radius: 12px; padding: 8px; font-weight: 700; }
    .nav-btn[aria-current="page"] { color: var(--action-text); background: var(--action-bg); border-color: var(--action-outline); }
    main { padding-block: 20px 56px; }
    h2 { color: var(--heading); font-size: 1.55rem; line-height: 1.25; margin: 0 0 12px; }
    h3 { color: var(--heading); font-size: 1.18rem; line-height: 1.3; margin: 0 0 10px; }
    p { margin: 0 0 12px; }
    .panel { background: var(--surface); border: 1px solid var(--borde); border-radius: 16px; padding: 18px; margin-bottom: 16px; }
    .status { color: var(--heading); font-weight: 700; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    .choice-buttons { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 16px; }
    #choice-view .choice-buttons { margin-top: 0; }
    .choice-buttons .btn { min-width: 0; }
    .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; border: 2px solid var(--action-outline); border-radius: 12px; padding: 9px 16px; background: var(--action-bg); color: var(--action-text); font-weight: 700; text-decoration: none; text-align: center; }
    .btn.secondary { background: var(--action-quiet-bg); color: var(--action-quiet-text); }
    .header-access { flex-shrink: 0; }
    ol { padding-left: 1.45em; margin: 0; }
    li { padding: 14px 4px; border-bottom: 1px solid var(--borde); }
    li:last-child { border-bottom: 0; }
    li p:last-child { margin-bottom: 0; }
    .meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(125px, 1fr)); gap: 9px; margin: 12px 0 0; }
    .meta div { background: var(--soft-bg); padding: 8px 10px; border-radius: 8px; }
    dt { font-size: .83rem; font-weight: 700; }
    dd { margin: 0; }
    .step-count { font-weight: 700; color: var(--heading); }
    .step-panel { border: 2px solid var(--step-border); padding: 20px; }
    .step-kicker { margin: 0 0 8px; color: var(--kicker); font-weight: 700; }
    .exercise-pair { display: grid; gap: 10px; padding: 0; margin: 12px 0; list-style: none; counter-reset: exercise; }
    .exercise-pair li { counter-increment: exercise; padding: 12px; border: 1px solid var(--borde); border-radius: 10px; background: var(--pair-bg); }
    .exercise-pair li::before { content: "Ejercicio " counter(exercise); display: block; color: var(--heading); font-size: .85rem; font-weight: 700; }
    .block-card { padding: 16px 0; border-top: 1px solid var(--borde); }
    .block-card:first-child { border-top: 0; padding-top: 0; }
    .block-card h4 { color: var(--heading); font-size: 1.08rem; margin: 0 0 8px; }
    .day-guidance { padding: 12px 14px; background: var(--soft-bg); border-radius: 10px; }
    .combo { margin-top: 12px; padding: 12px; background: var(--soft-bg); border-radius: 10px; }
    .combo strong { display: block; color: var(--heading); }
    .combo ul { margin: 6px 0 0; padding-left: 1.2em; }
    .combo li { border: 0; padding: 3px 0; }
    .table-wrap { max-width: 100%; overflow-x: auto; margin-top: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: .95rem; }
    th, td { padding: 8px 6px; text-align: left; border-bottom: 1px solid var(--borde); }
    th { background: var(--soft-bg); color: var(--heading); }
    .step-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .step-actions .btn { min-width: 0; padding-inline: 7px; }
    #next-step:focus { outline: 3px solid var(--focus); outline-offset: 3px; }
    fieldset { min-width: 0; border: 1px solid var(--borde); border-radius: 12px; margin: 0 0 18px; padding: 10px 14px 14px; }
    legend { color: var(--heading); font-weight: 700; padding-inline: 4px; }
    .preference { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 7px 4px; cursor: pointer; }
    .preference input { width: 22px; height: 22px; flex: none; margin: 0; accent-color: var(--action-outline); }
    .preference input:checked + span { font-weight: 700; }
    .access-actions { display: flex; flex-wrap: wrap; gap: 10px; }
    @media (max-width: 410px) {
      .header-inner { flex-wrap: wrap; }
      .actions > * { flex: 1 1 100%; }
    }
    @media (max-width: 480px) {
      :root[data-text-size="large"] .nav-inner,
      :root[data-text-size="large"] .choice-buttons,
      :root[data-text-size="large"] .step-actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#contenido">Saltar al contenido</a>
  <header>
    <div class="wrap header-inner">
      <div>
        <p class="brand">MurcielApp</p>
        <p class="subtitle">App de jugadoras · Las Murciélagas</p>
      </div>
      <button class="btn secondary header-access" id="accessibility-open" type="button" aria-controls="accessibility-section" aria-expanded="false">Accesibilidad</button>
    </div>
  </header>
  <nav aria-label="Navegación principal">
    <div class="wrap nav-inner">
      <button class="nav-btn" type="button" data-section="entrenar" aria-current="page">Entrenar</button>
      <button class="nav-btn" type="button" data-section="registrar">Registrar estímulo</button>
      <button class="nav-btn" type="button" data-section="penales">Penales</button>
      <button class="nav-btn" type="button" data-section="perfil">Mi perfil</button>
    </div>
  </nav>
  <main class="wrap" id="contenido" tabindex="-1">
    <section id="entrenar-section" aria-labelledby="entrenar-title">
      <h2 id="entrenar-title" tabindex="-1">Entrenar</h2>
      <p id="load-status" class="status" role="status">Cargando rutina…</p>
      <div id="routine-app" hidden>
        <div class="panel" id="choice-view">
          <div class="choice-buttons">
            <button class="btn" id="full-mode" type="button">Ver rutina</button>
            <button class="btn" id="step-mode" type="button">Paso a paso</button>
          </div>
        </div>
        <section class="panel" id="day-choice" aria-labelledby="day-choice-heading" hidden>
          <h3 id="day-choice-heading" tabindex="-1">Elegí un día</h3>
          <div id="day-buttons" class="choice-buttons"></div>
          <a id="pdf-link" class="btn secondary" href="./rutina-original.pdf" target="_blank" rel="noopener" style="width:100%;margin-top:16px">Ver PDF completo (nueva pestaña)</a>
          <a id="pdf-download" class="btn secondary" href="./rutina-original.pdf" download="Rutina-Sep-Oct-2026.pdf" style="width:100%;margin-top:12px">Descargar PDF</a>
          <button class="btn secondary" id="back-to-choice" type="button" style="width:100%;margin-top:12px">Volver a Entrenar</button>
        </section>
        <section id="full-view" class="panel" aria-labelledby="day-heading" hidden>
          <h3 id="day-heading" tabindex="-1"></h3>
          <p id="day-guidance" class="day-guidance" hidden></p>
          <div id="routine-list"></div>
          <button class="btn secondary" id="full-other-day" type="button" style="width:100%;margin-top:18px">Elegir otro día</button>
        </section>
        <section id="step-view" class="panel step-panel" aria-labelledby="step-heading" hidden>
          <p id="step-count" class="step-count"></p>
          <p id="round-label" class="step-kicker" hidden></p>
          <h3 id="step-heading" tabindex="-1"></h3>
          <div id="step-content"></div>
          <div class="step-actions" style="margin-top:18px">
            <button class="btn" id="previous-step" type="button">Anterior</button>
            <button class="btn" id="next-step" type="button">Siguiente</button>
          </div>
          <button class="btn secondary" id="exit-step" type="button" style="width:100%;margin-top:12px">Elegir otro día</button>
        </section>
        <section id="end-view" class="panel" aria-labelledby="end-heading" hidden>
          <h3 id="end-heading" tabindex="-1">Llegaste al final de la rutina</h3>
          <div class="actions">
            <button class="btn" type="button" id="register-from-end">Registrar estímulo</button>
            <button class="btn secondary" type="button" id="back-to-routine">Volver a la rutina</button>
          </div>
        </section>
      </div>
    </section>
    <section id="upcoming-section" class="panel" aria-labelledby="upcoming-title" hidden>
      <h2 id="upcoming-title" tabindex="-1"></h2>
      <p>Esta sección estará disponible próximamente.</p>
    </section>
    <section id="accessibility-section" class="panel" aria-labelledby="accessibility-title" hidden>
      <h2 id="accessibility-title" tabindex="-1">Accesibilidad</h2>
      <form id="accessibility-form">
        <fieldset>
          <legend>Contraste</legend>
          <label class="preference"><input type="radio" name="contrast" value="native" checked><span>Nativo</span></label>
          <label class="preference"><input type="radio" name="contrast" value="dark"><span>Alto contraste oscuro</span></label>
          <label class="preference"><input type="radio" name="contrast" value="light"><span>Alto contraste claro</span></label>
        </fieldset>
        <fieldset>
          <legend>Tamaño de texto</legend>
          <label class="preference"><input type="radio" name="textSize" value="native" checked><span>Nativo</span></label>
          <label class="preference"><input type="radio" name="textSize" value="large"><span>Grande</span></label>
        </fieldset>
        <fieldset>
          <legend>Destacar botones</legend>
          <label class="preference"><input type="radio" name="highlight" value="no" checked><span>No</span></label>
          <label class="preference"><input type="radio" name="highlight" value="yes"><span>Sí</span></label>
        </fieldset>
        <div class="access-actions">
          <button class="btn secondary" id="reset-accessibility" type="button">Restablecer ajustes</button>
          <button class="btn" id="close-accessibility" type="button">Volver</button>
        </div>
      </form>
    </section>
    <p id="announcement" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></p>
  </main>
  <style>.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}</style>
  <script>
    'use strict';
    const state = { routine: null, dayIndex: null, steps: [], stepIndex: 0, mode: null, section: 'entrenar', accessibilityOpen: false };
    const byId = id => document.getElementById(id);
    const preferenceKey = 'murcielapp.accessibility.v1';
    const preferenceDefaults = { contrast: 'native', textSize: 'native', highlight: 'no' };
    const preferenceValues = { contrast: ['native', 'dark', 'light'], textSize: ['native', 'large'], highlight: ['no', 'yes'] };
    function readPreferences() {
      try {
        const saved = JSON.parse(localStorage.getItem(preferenceKey) || '{}');
        return Object.fromEntries(Object.entries(preferenceDefaults).map(([name, fallback]) =>
          [name, preferenceValues[name].includes(saved[name]) ? saved[name] : fallback]));
      } catch { return { ...preferenceDefaults }; }
    }
    function applyPreferences(preferences) {
      const root = document.documentElement;
      if (preferences.contrast === 'native') delete root.dataset.contrast;
      else root.dataset.contrast = preferences.contrast;
      if (preferences.textSize === 'native') delete root.dataset.textSize;
      else root.dataset.textSize = preferences.textSize;
      if (preferences.highlight === 'no') delete root.dataset.highlight;
      else root.dataset.highlight = preferences.highlight;
      for (const [name, value] of Object.entries(preferences)) {
        byId('accessibility-form').elements[name].value = value;
      }
    }
    function savePreferences() {
      const form = byId('accessibility-form');
      const preferences = Object.fromEntries(Object.keys(preferenceDefaults).map(name => [name, form.elements[name].value]));
      applyPreferences(preferences);
      try { localStorage.setItem(preferenceKey, JSON.stringify(preferences)); } catch { /* La preferencia sigue activa durante esta visita. */ }
    }
    applyPreferences(readPreferences());
    const announce = message => {
      const target = byId('announcement');
      target.textContent = '';
      window.setTimeout(() => { target.textContent = message; }, 30);
    };

    function addMeta(container, label, value) {
      if (!value) return;
      const box = document.createElement('div');
      const term = document.createElement('dt');
      term.textContent = label;
      const detail = document.createElement('dd');
      detail.textContent = value;
      box.append(term, detail);
      container.append(box);
    }

    function fillMeta(container, item, includeSeries = true) {
      container.replaceChildren();
      addMeta(container, 'Tiempo', item.tiempo);
      if (includeSeries) addMeta(container, 'Series', item.series);
      if (item.pausa && item.pausa !== '0' && item.pausa !== 'No indicada') addMeta(container, 'Pausa', item.pausa);
    }

    function currentDay() { return state.routine.dias[state.dayIndex]; }

    function renderDetails(container, item, includeSeries = true) {
      if (item.tipo === 'zona-media') {
        const pair = document.createElement('ol');
        pair.className = 'exercise-pair';
        item.ejercicios.forEach(exercise => {
          const li = document.createElement('li');
          li.textContent = exercise;
          pair.append(li);
        });
        container.append(pair);
      } else if (item.tipo === 'fuerza') {
        if (item.principal && item.principal !== item.titulo) {
          const principal = document.createElement('p');
          principal.textContent = item.principal;
          container.append(principal);
        }
        if (item.progresion) {
          const wrap = document.createElement('div');
          wrap.className = 'table-wrap';
          const table = document.createElement('table');
          const caption = document.createElement('caption');
          caption.className = 'visually-hidden';
          caption.textContent = `Series de ${item.titulo.toLowerCase()}`;
          const head = document.createElement('thead');
          const headRow = document.createElement('tr');
          ['Serie', 'Repeticiones', 'Carga'].forEach(label => {
            const th = document.createElement('th');
            th.scope = 'col';
            th.textContent = label;
            headRow.append(th);
          });
          head.append(headRow);
          const body = document.createElement('tbody');
          item.progresion.forEach(row => {
            const tr = document.createElement('tr');
            [row.serie, row.repeticiones, row.carga].forEach((value, column) => {
              const cell = document.createElement(column === 0 ? 'th' : 'td');
              if (column === 0) cell.scope = 'row';
              cell.textContent = String(value);
              tr.append(cell);
            });
            body.append(tr);
          });
          table.append(caption, head, body);
          wrap.append(table);
          container.append(wrap);
        }
        if (item.combinado?.length) {
          const combo = document.createElement('div');
          combo.className = 'combo';
          const label = document.createElement('strong');
          label.textContent = 'Se combina con';
          const list = document.createElement('ul');
          item.combinado.forEach(exercise => {
            const li = document.createElement('li');
            li.textContent = exercise;
            list.append(li);
          });
          combo.append(label, list);
          container.append(combo);
        }
      } else if (item.detalle) {
        const detail = document.createElement('p');
        detail.textContent = item.detalle;
        container.append(detail);
      }
      const meta = document.createElement('dl');
      meta.className = 'meta';
      fillMeta(meta, item, includeSeries);
      if (meta.children.length) container.append(meta);
    }

    function buildSteps(day) {
      const steps = [];
      for (let index = 0; index < day.bloques.length;) {
        if (day.bloques[index].tipo !== 'zona-media') {
          steps.push({ item: day.bloques[index] });
          index++;
          continue;
        }
        const group = [];
        while (index < day.bloques.length && day.bloques[index].tipo === 'zona-media') {
          group.push(day.bloques[index]);
          index++;
        }
        const rounds = group[0].series;
        for (let round = 1; round <= rounds; round++) {
          group.forEach((item, position) => steps.push({ item, round, rounds, position: position + 1, groupLength: group.length }));
        }
      }
      return steps;
    }

    function renderFull() {
      const day = currentDay();
      byId('day-heading').textContent = day.nombre;
      byId('day-guidance').textContent = day.indicacion || '';
      byId('day-guidance').hidden = !day.indicacion;
      const list = byId('routine-list');
      list.replaceChildren();
      day.bloques.forEach(item => {
        const article = document.createElement('article');
        article.className = 'block-card';
        const title = document.createElement('h4');
        title.textContent = item.titulo;
        article.append(title);
        renderDetails(article, item);
        list.append(article);
      });
    }

    function stepAnnouncement(step) {
      const item = step.item;
      const parts = [byId('step-count').textContent];
      if (step.round) parts.push(byId('round-label').textContent);
      parts.push(item.titulo);
      if (state.stepIndex === 0 && currentDay().indicacion) parts.push(currentDay().indicacion);
      if (item.tipo === 'zona-media') {
        item.ejercicios.forEach((exercise, index) => parts.push(`Ejercicio ${index + 1}: ${exercise}`));
      } else if (item.tipo === 'fuerza') {
        if (item.principal && item.principal !== item.titulo) parts.push(item.principal);
        item.progresion?.forEach(row => parts.push(`Serie ${row.serie}: ${row.repeticiones} repeticiones, ${row.carga}`));
        if (item.combinado?.length) parts.push(`Se combina con: ${item.combinado.join('; ')}`);
      } else if (item.detalle) parts.push(item.detalle);
      if (item.tiempo) parts.push(`Tiempo: ${item.tiempo}`);
      if (!step.round && item.series) parts.push(`Series: ${item.series}`);
      if (item.pausa && item.pausa !== '0' && item.pausa !== 'No indicada') parts.push(`Pausa: ${item.pausa}`);
      return parts.join('. ');
    }

    function renderStep(focus = false) {
      const atEnd = state.stepIndex >= state.steps.length;
      byId('step-view').hidden = atEnd;
      byId('end-view').hidden = !atEnd;
      if (atEnd) {
        byId('end-heading').focus();
        announce('Llegaste al final de la rutina.');
        return;
      }
      const step = state.steps[state.stepIndex];
      const item = step.item;
      byId('step-count').textContent = `${currentDay().nombre} · indicación ${state.stepIndex + 1} de ${state.steps.length}`;
      byId('round-label').hidden = !step.round;
      byId('round-label').textContent = step.round
        ? `Zona media · vuelta ${step.round} de ${step.rounds} · bloque ${step.position} de ${step.groupLength}` : '';
      byId('step-heading').textContent = item.titulo;
      const content = byId('step-content');
      content.replaceChildren();
      if (state.stepIndex === 0 && currentDay().indicacion) {
        const guidance = document.createElement('p');
        guidance.className = 'day-guidance';
        guidance.textContent = currentDay().indicacion;
        content.append(guidance);
      }
      renderDetails(content, item, !step.round);
      byId('previous-step').disabled = state.stepIndex === 0;
      byId('next-step').textContent = state.stepIndex === state.steps.length - 1 ? 'Llegar al final' : 'Siguiente';
      if (focus) byId('next-step').focus();
      announce(stepAnnouncement(step));
    }

    function hideTrainingViews() {
      ['choice-view', 'day-choice', 'full-view', 'step-view', 'end-view'].forEach(id => {
        byId(id).hidden = true;
      });
    }

    function showTrainingChoice() {
      state.mode = null;
      hideTrainingViews();
      byId('choice-view').hidden = false;
      byId('full-mode').focus();
    }

    function chooseMode(mode) {
      state.mode = mode;
      hideTrainingViews();
      byId('day-choice-heading').textContent = mode === 'full'
        ? 'Ver rutina · elegí un día' : 'Paso a paso · elegí un día';
      byId('pdf-link').hidden = mode !== 'full';
      byId('pdf-download').hidden = mode !== 'full';
      byId('day-choice').hidden = false;
      byId('day-choice-heading').focus();
    }

    function chooseDay(index) {
      state.dayIndex = index;
      hideTrainingViews();
      if (state.mode === 'full') {
        byId('full-view').hidden = false;
        renderFull();
        byId('day-heading').focus();
      } else {
        state.stepIndex = 0;
        state.steps = buildSteps(currentDay());
        byId('step-view').hidden = false;
        renderStep(true);
      }
    }

    function showSection(section) {
      state.section = section;
      state.accessibilityOpen = false;
      byId('accessibility-section').hidden = true;
      byId('accessibility-open').setAttribute('aria-expanded', 'false');
      const isTraining = section === 'entrenar';
      byId('entrenar-section').hidden = !isTraining;
      byId('upcoming-section').hidden = isTraining;
      document.querySelectorAll('.nav-btn').forEach(button => {
        if (button.dataset.section === section) button.setAttribute('aria-current', 'page');
        else button.removeAttribute('aria-current');
      });
      if (isTraining) {
        if (state.routine) showTrainingChoice();
        else byId('entrenar-title').focus();
      }
      else {
        byId('upcoming-title').textContent = {
          registrar: 'Registrar estímulo', penales: 'Penales', perfil: 'Mi perfil'
        }[section];
        byId('upcoming-title').focus();
      }
    }

    function openAccessibility() {
      state.accessibilityOpen = true;
      byId('entrenar-section').hidden = true;
      byId('upcoming-section').hidden = true;
      byId('accessibility-section').hidden = false;
      byId('accessibility-open').setAttribute('aria-expanded', 'true');
      document.querySelectorAll('.nav-btn').forEach(button => button.removeAttribute('aria-current'));
      byId('accessibility-title').focus();
    }

    function closeAccessibility() {
      state.accessibilityOpen = false;
      byId('accessibility-section').hidden = true;
      byId('accessibility-open').setAttribute('aria-expanded', 'false');
      byId('entrenar-section').hidden = state.section !== 'entrenar';
      byId('upcoming-section').hidden = state.section === 'entrenar';
      document.querySelector(`.nav-btn[data-section="${state.section}"]`).setAttribute('aria-current', 'page');
      byId('accessibility-open').focus();
    }

    async function loadRoutine() {
      try {
        const response = await fetch('./rutina.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('Rutina no disponible');
        const data = await response.json();
        if (!Array.isArray(data.dias) || !data.dias.length || data.dias.some(day => !Array.isArray(day.bloques))) {
          throw new Error('Formato de rutina inválido');
        }
        state.routine = data;
        const dayButtons = byId('day-buttons');
        data.dias.forEach((day, index) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'btn secondary';
          button.textContent = day.nombre;
          button.addEventListener('click', () => chooseDay(index));
          dayButtons.append(button);
        });
        byId('load-status').hidden = true;
        byId('routine-app').hidden = false;
      } catch (error) {
        byId('load-status').textContent = 'No hay una rutina disponible para esta prueba. Consultá a quien preparó el enlace.';
        console.error('No se pudo cargar la rutina local:', error);
      }
    }

    document.querySelectorAll('.nav-btn').forEach(button => button.addEventListener('click', () => showSection(button.dataset.section)));
    byId('accessibility-open').addEventListener('click', openAccessibility);
    byId('close-accessibility').addEventListener('click', closeAccessibility);
    byId('accessibility-form').addEventListener('change', savePreferences);
    byId('reset-accessibility').addEventListener('click', () => {
      applyPreferences(preferenceDefaults);
      try { localStorage.removeItem(preferenceKey); } catch { /* La preferencia vuelve al valor inicial durante esta visita. */ }
      announce('Ajustes restablecidos.');
    });
    byId('full-mode').addEventListener('click', () => chooseMode('full'));
    byId('step-mode').addEventListener('click', () => chooseMode('step'));
    byId('back-to-choice').addEventListener('click', showTrainingChoice);
    byId('full-other-day').addEventListener('click', () => chooseMode('full'));
    byId('previous-step').addEventListener('click', () => {
      if (state.stepIndex > 0) { state.stepIndex--; renderStep(true); }
    });
    byId('next-step').addEventListener('click', () => {
      state.stepIndex++;
      renderStep(false);
    });
    byId('back-to-routine').addEventListener('click', () => chooseDay(state.dayIndex));
    byId('exit-step').addEventListener('click', () => chooseMode('step'));
    byId('register-from-end').addEventListener('click', () => showSection('registrar'));
    loadRoutine();
  </script>
</body>
</html>
